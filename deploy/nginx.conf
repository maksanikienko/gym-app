# /etc/nginx/sites-available/gym  — replace gym.example.com and paths
server {
    listen 80;
    server_name gym.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gym.example.com;

    # certbot --nginx -d gym.example.com fills these in
    ssl_certificate     /etc/letsencrypt/live/gym.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gym.example.com/privkey.pem;

    root /var/www/gym-app/frontend/dist;
    index index.html;
    client_max_body_size 5m;

    # Laravel API + Sanctum CSRF endpoint
    location ~ ^/(api|sanctum)/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/gym-app/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # PWA: service worker and entry must always be revalidated
    location = /sw.js         { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html    { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Hashed build assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
